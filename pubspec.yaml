name: catat_keuangan
description: "Aplikasi Catat Keuangan dengan Scan Struk AI dan Kategori Dinamis."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  google_mlkit_text_recognition: ^0.17.1
  image_picker: ^1.2.4
  intl: ^0.20.3
  uuid: ^4.6.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.5

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#0F172A"
  image: assets/images/icon.png
  android_12:
    color: "#0F172A"
    image: assets/images/icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/images/
